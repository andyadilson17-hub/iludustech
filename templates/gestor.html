<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Gestor - DevSolutions</title>
    <link rel="stylesheet" href="static/css/gestor.css">
</head>
<body>
    <!-- Header -->
    <header class="header">
        <div class="header-content">
            <div class="user-info">
                <div class="manager-badge">📋 GESTOR</div>
                <div>
                    <div class="user-name" id="userName"></div>
                    <div class="user-email" id="userEmail"></div>
                </div>
            </div>
            <button class="btn-logout" id="logoutBtn">
                <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
                </svg>
                Sair
            </button>
        </div>
    </header>

    <!-- Main Content -->
    <main class="main-content">
        <div class="page-header">
            <h2 class="page-title">Meus Projetos</h2>
            <div class="stats-summary">
                <div class="stat-item">
                    <span class="stat-number" id="totalProjects">0</span>
                    <span class="stat-label">Total</span>
                </div>
                <div class="stat-item">
                    <span class="stat-number" id="activeProjects">0</span>
                    <span class="stat-label">Em Andamento</span>
                </div>
                <div class="stat-item">
                    <span class="stat-number" id="completedProjects">0</span>
                    <span class="stat-label">Concluídos</span>
                </div>
            </div>
        </div>

        <!-- Projects List -->
        <div id="projectsList"></div>

        <!-- Empty State -->
        <div id="emptyState" class="empty-state hidden">
            <div class="empty-icon">📂</div>
            <h3>Nenhum projeto atribuído</h3>
            <p>Aguarde o administrador atribuir projetos para você gerenciar.</p>
        </div>
    </main>

    <!-- Update Progress Modal -->
    <div id="progressModal" class="modal hidden">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Atualizar Progresso do Projeto</h3>
                <button class="btn-close" onclick="closeProgressModal()">×</button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label>Status</label>
                    <select id="statusSelect" class="form-select">
                        <option value="pending">Aguardando</option>
                        <option value="in-progress">Em Andamento</option>
                        <option value="completed">Concluído</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Etapa Atual</label>
                    <select id="stageSelect" class="form-select">
                        <option value="Aguardando início">Aguardando início</option>
                        <option value="Análise">Análise</option>
                        <option value="Desenvolvimento">Desenvolvimento</option>
                        <option value="Testes">Testes</option>
                        <option value="Concluído">Concluído</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Progresso (%)</label>
                    <input type="range" id="progressSlider" min="0" max="100" value="0" class="progress-slider">
                    <div class="progress-value" id="progressValue">0%</div>
                </div>

                <div class="form-group">
                    <label>Adicionar Comentário</label>
                    <textarea id="managerComment" rows="3" class="form-textarea" placeholder="Atualize o cliente sobre o progresso..."></textarea>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="closeProgressModal()">Cancelar</button>
                <button class="btn btn-primary" onclick="confirmUpdate()">Atualizar</button>
            </div>
        </div>
    </div>

    <script src="static/js/gestor.js"></script>
</body>
</html>
