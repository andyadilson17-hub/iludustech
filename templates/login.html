<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - DevSolutions</title>
    <link rel="stylesheet" href="static/css/auth.css">
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />

</head>
<body>

    <!-- atualizado -->
    <div class="particles" id="particles"></div>

    <div class="auth-container">
            <!-- lado esquerdo -->
    <div class="auth-side">

        <div class="brand-box">

            <div class="brand-logo">
                <i class="fa-solid fa-layer-group"></i>
            </div>

            <h1>Iludus Tech</h1>

            <p>
                Soluções digitais modernas para empresas,
                startups e negócios inovadores.
            </p>

            <div class="brand-features">

                <div class="brand-feature">
                    <i class="fa-solid fa-shield-halved"></i>
                    Segurança Avançada
                </div>

                <div class="brand-feature">
                    <i class="fa-solid fa-bolt"></i>
                    Alta Performance
                </div>

                <div class="brand-feature">
                    <i class="fa-solid fa-chart-line"></i>
                    Gestão Inteligente
                </div>

            </div>

        </div>
    </div>

    <!-- lado formulário -->
    <div class="auth-content">
    
        <div class="auth-box">
            <div class="auth-header">
                <div class="icon-circle">
                    <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
                    </svg>
                </div>
                <h1 id="authTitle">Bem-vindo</h1>
                <p class="subtitle" id="authSubtitle">Entre na sua conta</p>
            </div>

            <form id="loginForm">
                <div class="form-group">
                    <label>Email</label>
                    <div class="input-wrapper">
                        <svg class="input-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
                        </svg>
                        <input type="email" id="loginEmail" placeholder="seu@email.com" required>
                    </div>
                </div>

                <div class="form-group">
                    <label>Senha</label>
                    <div class="input-wrapper">
                        <svg class="input-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
                        </svg>
                        <input type="password" id="loginPassword" placeholder="••••••••" required>
                        <button type="button" class="toggle-password" id="togglePassword">
                            <i class="fa-solid fa-eye"></i>
                        </button>
                    </div>
                </div>

                <div id="roleGroup" class="form-group hidden">
                    <label>Tipo de Cliente</label>
                    <select id="roleSelect" class="form-select">
                        <option value="cliente">Pessoa Singular</option>
                        <option value="gestor">Entidade Empresarial</option>
                    </select>
                </div>

                <button type="submit" class="btn btn-primary" id="authButton">Entrar</button>
            </form>

            <div class="auth-footer">
                <a href="/register">
                    <button type="button" class="link-button" id="toggleAuth">
                        Não tem conta? Cadastre-se
                    </button>
                </a>
                <a href="/landing" class="link-button">Voltar ao Início</a>
            </div>
        </div>
    </div>

    <script>

        

        function showPopup(msg){
            const popup = document.getElementById("popup");
            document.getElementById("popupMessage").innerText = msg;
            popup.classList.remove("hidden");
            document.body.style.overflow = "hidden";
        }

        function closePopup(){
            document.getElementById("popup").classList.add("hidden");
            document.body.style.overflow = "auto";
        }



        function validateField(id, msg){

        const el =
        document.getElementById(id);

        const wrapper =
        el.closest(".input-wrapper");

        if(!el.value.trim()){

            wrapper.classList.add("shake-error");

            el.classList.add("shake-border");

            setTimeout(() => {

                wrapper.classList.remove("shake-error");

                el.classList.remove("shake-border");

            }, 500);

            el.focus();

            showPopup(msg);

            return false;
        }

        return true;
    }

        document.getElementById("loginForm").addEventListener("submit", function(e){
            e.preventDefault();

            console.log("FORM SUBMETIDO"); //teste

            if(!validateField("loginEmail", "Email obrigatório")) return;
            if(!validateField("loginPassword", "Senha obrigatória")) return;

            const email = document.getElementById("loginEmail").value;
            const password = document.getElementById("loginPassword").value;

            fetch("/api/login", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({ email, password })
            })
            .then(res => res.json())
            .then(data => {
                if(data.status === "sucesso"){

                    // salvar sessão
                    localStorage.setItem("currentUser", JSON.stringify(data.user));

                    showPopup("Login realizado com sucesso");

                    setTimeout(()=>{
                        window.location.href = "/cliente"; // vamos criar essa rota depois
                    },1000);

                } else if(data.status === "nao_existe"){
                    resetButton();
                    showPopup("Usuário não existe");
                } else if(data.status === "senha_incorreta"){
                    resetButton();
                    showPopup("Senha incorreta");
                } else {
                    resetButton();
                    showPopup("Erro no login");
                }
            });

            // ========================================
            // RESET BUTTON
            // atualizado
            // ========================================

            function resetButton(){

                const btn =
                document.getElementById("authButton");

                btn.innerHTML = "Entrar";

                btn.disabled = false;

            }
        });

        // ========================================
        // SHOW/HIDE PASSWORD
        // atualizado
        // ========================================

        const togglePassword =
        document.getElementById("togglePassword");

        const passwordInput =
        document.getElementById("loginPassword");

        if(togglePassword && passwordInput){

            togglePassword.addEventListener("click", () => {

                const icon =
                togglePassword.querySelector("i");

                if(passwordInput.type === "password"){

                    passwordInput.type = "text";

                    icon.classList.remove("fa-eye");
                    icon.classList.add("fa-eye-slash");

                }else{

                    passwordInput.type = "password";

                    icon.classList.remove("fa-eye-slash");
                    icon.classList.add("fa-eye");

                }

            });

        }

        function createParticle(){

    const particle = document.createElement("div");

    particle.classList.add("particle");

    // tamanho aleatório
    const size = Math.random() * 6 + 2;

    particle.style.width = `${size}px`;
    particle.style.height = `${size}px`;

    // posição aleatória
    particle.style.left = `${Math.random() * 100}%`;
    particle.style.bottom = `-20px`;

    // duração
    const duration = Math.random() * 10 + 8;

    particle.style.animationDuration = `${duration}s`;

    // opacidade
    particle.style.opacity = Math.random();

    particlesContainer.appendChild(particle);

    // remover depois
    setTimeout(() => {

        particle.remove();

    }, duration * 1000);
}

// criar continuamente
setInterval(() => {

    createParticle();

}, 300);


    </script>

    <div id="popup" class="popup hidden">
        <div class="popup-content">
            <p id="popupMessage"></p>
            <button onclick="closePopup()">OK</button>
        </div>
    </div>

    <script src="static/js/auth.js"></script>
</body>
</html>
