<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resister - DevSolutions</title>
    <link rel="stylesheet" href="static/css/auth.css">
</head>
<body class= "register-page">


    <div class="auth-container">
        <div class="auth-box">
            <div class="auth-header">
                <div class="icon-circle">
                    <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
                    </svg>
                </div>
                <h1 id="authTitle">Bem-vindo</h1>
                <p class="subtitle" id="authSubtitle">Entre na sua conta</p>
            </div>

            <form id="registerForm">
                <div class="form-group">
                    <label>Nome Completo</label>
                    <div class="input-wrapper">
                        <svg class="input-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
                        </svg>
                        <input type="text" id="registerName" placeholder="Seu nome">
                    </div>
                </div>

                <div class="form-group">
                    <label>Email</label>
                    <div class="input-wrapper">
                        <svg class="input-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
                        </svg>
                        <input type="email" id="registerEmail" placeholder="seu@email.com" required>
                    </div>
                </div>

                <div class="form-group">
                    <label>Senha</label>
                    <div class="input-wrapper">
                        <svg class="input-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
                        </svg>
                        <input type="password" id="registerPassword" placeholder="••••••••" required>
                    </div>
                </div>

                <div class="form-group">
                    <label>Confirmar Senha</label>
                    <div class="input-wrapper">
                        <svg class="input-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
                        </svg>
                        <input type="password" id="confirmPassword" placeholder="••••••••" required>
                    </div>
                </div>

                <div class="form-group">
                    <label>Tipo de Cliente</label>
                    <select id="roleSelect" class="form-select">
                        <option value="cliente">Pessoa Singular</option>
                        <option value="gestor">Entidade Empresarial</option>
                    </select>
                </div>

                <button type="submit" class="btn btn-primary" id="authButton">Cadastrar</button>
            </form>

            <div class="auth-footer">
                <a href="/login" class="link-button">Já possui uma conta? Entrar</a>
                <a href="/" class="link-button">Voltar ao Início</a>
            </div>
        </div>
    </div>

    <script src="static/js/auth.js"></script>
    <script>
        function showPopup(msg){
            const popup = document.getElementById("popup");
            document.getElementById("popupMessage").innerText = msg;
            popup.classList.remove("hidden");
            document.body.style.overflow = "hidden";
        }

        function closePopup(){
            const popup = document.getElementById("popup");
            popup.classList.add("hidden");
            document.body.style.overflow = "auto";
        }

        // Validação melhorada com foco automático
        function validateField(id, msg){
            const el = document.getElementById(id);
            if(!el.value.trim()){
                showPopup(msg);
                // O timeout garante que o foco ocorra após o alerta/popup ser processado
                setTimeout(() => el.focus(), 100); 
                el.style.borderColor = "red"; 
                return false;
            } else {
                el.style.borderColor = "";
                return true;
            }
        }

        document.getElementById("registerForm").addEventListener("submit", function(e){
            e.preventDefault();

            // Validação de campos obrigatórios
            if(!validateField("registerName", "Por favor, preencha seu nome completo.")) return;
            if(!validateField("registerEmail", "O campo de e-mail é obrigatório.")) return;
            if(!validateField("registerPassword", "A senha é obrigatória.")) return;
            if(!validateField("confirmPassword", "Confirme sua senha.")) return;

            const email = document.getElementById("registerEmail").value;
            const password = document.getElementById("registerPassword").value;
            const confirm = document.getElementById("confirmPassword").value;

            // Validação de formato de e-mail
            const regexEmail = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if(!regexEmail.test(email)){
                showPopup("Digite um formato de e-mail válido (ex: nome@email.com)");
                document.getElementById("registerEmail").focus();
                return;
            }

            // Validação de coincidência de senhas
            if(password !== confirm){
                showPopup("As senhas não coincidem!");
                document.getElementById("confirmPassword").focus();
                return;
            }

            const tipo = document.getElementById("roleSelect").value;
            const btn = document.getElementById("authButton");
            
            // Feedback visual de carregamento
            btn.innerText = "Processando...";
            btn.disabled = true;

            fetch("/api/register", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    name: document.getElementById("registerName").value,
                    email: email,
                    password: password,
                    tipo: tipo
                })
            })
            .then(res => res.json())
            .then(data => {
                btn.innerText = "Cadastrar";
                btn.disabled = false;

                if(data.status === "sucesso"){
                    showPopup("Código enviado para o seu e-mail!");
                    localStorage.setItem("email_verify", email);
                    setTimeout(() => {
                        window.location.href = "/verify";
                    }, 1500);
                } else if(data.status === "existe") {
                    showPopup("Este e-mail já está cadastrado em nosso sistema.");
                    document.getElementById("registerEmail").focus(); // Foca no e-mail duplicado
                    document.getElementById("registerEmail").style.borderColor = "red";
                } else if(data.status === "erro_email"){
                    showPopup("Erro ao enviar e-mail de verificação. Tente novamente.");
                } else {
                    showPopup(data.mensagem || "Erro ao realizar cadastro.");
                }
            })
            .catch(err => {
                btn.innerText = "Cadastrar";
                btn.disabled = false;
                showPopup("Erro de conexão com o servidor.");
                console.error(err);
            });
        });
    </script>

    <div id="popup" class="popup hidden">
        <div class="popup-content">
            <p id="popupMessage"></p>
            <button onclick="closePopup()">OK</button>
        </div>
    </div>
</body>
</html>
